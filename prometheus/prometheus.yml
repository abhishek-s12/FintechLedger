global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'fintech-ledger-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['fintech-api:8080']
        labels:
          application: 'fintech-ledger'
          environment: 'production'
