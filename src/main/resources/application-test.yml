spring:
  datasource:
    url: jdbc:h2:mem:fintech_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      auto-create: false
      fail-fast: false

fintech:
  outbox:
    poll-interval-ms: 600000
  ratelimit:
    enabled: false

logging:
  level:
    com.abhishek.fintech: INFO
    org.springframework.test: INFO
